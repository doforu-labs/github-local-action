name: 队列补发验收

# 手动跑：4 个 job 抢 2 台机器（Linux 1 台、Windows 1 台）。
# 第一波 webhook 只能接住各平台最先那个 job，另一个此刻没有空闲机器——以前就这么
# 丢掉不管了，现在应该由定时对账在机器空出来之后补上。跑完四个都绿 = 对账生效。
on:
  workflow_dispatch:

concurrency:
  group: queue-check
  cancel-in-progress: false

jobs:
  linux:
    name: linux-${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    # 这条 workflow 会把 job 派到 self-hosted 机器上，所以不跟仓库名绑定：
    # 用仓库变量当开关，没设 RUN_SELF_HOSTED=true 就不跑（fork 里天然是关的）。
    if: vars.RUN_SELF_HOSTED == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: 占住机器一会儿
        run: |
          echo "runner=${RUNNER_NAME}"
          echo "job=${GITHUB_JOB} nth=${{ matrix.n }}"
          sleep 25
      - name: 收尾
        run: echo done

  windows:
    name: windows-${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    # 这条 workflow 会把 job 派到 self-hosted 机器上，所以不跟仓库名绑定：
    # 用仓库变量当开关，没设 RUN_SELF_HOSTED=true 就不跑（fork 里天然是关的）。
    if: vars.RUN_SELF_HOSTED == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      # 脚本内容保持纯 ASCII：Windows PowerShell 5.1 会把无 BOM 的 ps1 按 ANSI 解码
      - name: hold the machine
        shell: powershell
        run: |
          Write-Output "runner=$env:RUNNER_NAME"
          Write-Output "job=$env:GITHUB_JOB nth=${{ matrix.n }}"
          Start-Sleep -Seconds 25
      - name: finish
        shell: powershell
        run: Write-Output done
