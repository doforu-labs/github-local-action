name: 平台可用性验收

# 挨个平台跑一遍按需 runner：Linux x64、macOS arm64、macOS x64、Windows x64。
# 每个 job 都会打印自己落在哪台机器上，所以跑完这张表就能看出哪类平台没接住。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/platform-check.yml'

concurrency:
  group: platform-check
  cancel-in-progress: false

jobs:
  posix:
    name: ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            runs_on: [self-hosted, Linux, X64]
          - name: macos-arm64
            runs_on: [self-hosted, macOS, ARM64]
          - name: macos-x64
            runs_on: [self-hosted, macOS, X64]
    # 公开仓库里任何人都能 fork / 开 PR；这条 workflow 会把 job 派到作者自己的
    # self-hosted 机器上，所以用仓库名把自己锁住：在任何 fork 里都不会跑。
    if: github.repository == 'OWNER/github-local-action'
    runs-on: ${{ matrix.target.runs_on }}
    timeout-minutes: 15
    steps:
      - name: 报平台和 runner
        run: |
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}  arch=${RUNNER_ARCH}"
          uname -a
          sw_vers 2>/dev/null || head -2 /etc/os-release
          echo "workspace=${GITHUB_WORKSPACE}"
          echo "proxy=${HTTPS_PROXY:-<none>}"
          echo "no_proxy=${NO_PROXY:-<none>}"
      - name: 出网
        run: |
          curl -sS --max-time 15 -o /dev/null \
            -w 'api.github.com %{http_code} %{time_total}s\n' https://api.github.com/zen
      - uses: actions/checkout@v4
      - name: 仓里读一个文件
        run: |
          ls -1 | head -5
          test -f README.md && echo "README.md 有 $(wc -l < README.md) 行"

  windows:
    name: windows-x64
    # 公开仓库里任何人都能 fork / 开 PR；这条 workflow 会把 job 派到作者自己的
    # self-hosted 机器上，所以用仓库名把自己锁住：在任何 fork 里都不会跑。
    if: github.repository == 'OWNER/github-local-action'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      # 脚本内容必须纯 ASCII：这些机器只有 Windows PowerShell 5.1，它按 ANSI 读
      # 没有 BOM 的 .ps1，中文会把字符串引号配对搞坏（实测报 missing the terminator）。
      - name: 报平台和 runner
        shell: powershell
        run: |
          Write-Output "runner=$env:RUNNER_NAME"
          Write-Output "os=$env:RUNNER_OS  arch=$env:RUNNER_ARCH"
          Write-Output ([System.Environment]::OSVersion.VersionString)
          Write-Output "cpu=$env:PROCESSOR_ARCHITECTURE  cores=$env:NUMBER_OF_PROCESSORS"
          Write-Output "workspace=$env:GITHUB_WORKSPACE"
          Write-Output "proxy=$env:HTTPS_PROXY  no_proxy=$env:NO_PROXY"
      - name: 出网
        shell: powershell
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 https://api.github.com/zen
          $sw.Stop()
          Write-Output ("api.github.com {0} {1}s" -f $r.StatusCode, [math]::Round($sw.Elapsed.TotalSeconds,2))
      - uses: actions/checkout@v4
      - name: 仓里读一个文件
        shell: powershell
        run: |
          Get-ChildItem -Name | Select-Object -First 5
          if (Test-Path README.md) { Write-Output "README.md lines: $((Get-Content README.md).Count)" }
