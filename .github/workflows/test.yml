name: CI

# 跑在 GitHub 托管的机器上，跟 .github/workflows/platform-*.yml 那两条不是一回事：
# 那两条是「往我自己的机器上派活」的验收（要 self-hosted），这两条是给外人用的密码线。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pii:
    name: 脱敏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_pii.py --verbose

  python:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }   # requires-python 的下限
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 装依赖
        run: pip install -r local-client/requirements.txt
      - name: 单测（local-client/tests/unit_*.py）
        run: python scripts/run_tests.py --only py

  js:
    name: node${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 前端单测（local-client/tests/unit_*.js）
        # 前端代码是页面里的纯函数，用 node 直接跑，不需要浏览器
        run: python scripts/run_tests.py --only js

  e2e:
    name: e2e（假 Hub 全链路）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r local-client/requirements.txt
      - run: python scripts/run_tests.py --only e2e

  worker:
    name: worker 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-worker/package-lock.json
      - working-directory: remote-worker
        run: npm ci
      - working-directory: remote-worker
        run: npm run typecheck

  docker:
    name: 镜像构建 + 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建镜像
        run: docker build -t github-local-action:ci .
      # 只构建不跑容器：真正的运行时验证（本机闸 403/200、配置写回）在
      # docs/docker.md 里写了怎么手工跑，CI 这里只防镜像悄无声息地烂掉
      - name: 镜像里该有的东西都在，不该有的都不在
        run: |
          docker run --rm --entrypoint sh github-local-action:ci -c '
            set -e
            gh --version | head -1
            command -v node && { echo "镜像里不该有 node"; exit 1; } || true
            command -v wrangler && { echo "镜像里不该有 wrangler"; exit 1; } || true
            # 直接问程序自己：状态页找得到且读得出内容（136KB 左右）。
            # 别去猜路径——它在 site-packages 和 <prefix>/share 下都找得到
            python -c "import relay,sys; n=len(relay.read_index()); print(\"状态页 \", n, \"字节\"); sys.exit(0 if n > 1000 else 1)"
            python -c "import aiohttp, paramiko; print(\"aiohttp + paramiko OK\")"
            # 本地产物不该被打进镜像（.dockerignore 的 ** 前缀踩过坑）
            for f in /app/local-client/config.toml /app/local-client/events.db; do
              test -e "$f" && { echo "本地产物混进镜像了: $f"; exit 1; } || true
            done
            id -u | grep -qx 10001 && echo "非 root 运行：OK"
          '
