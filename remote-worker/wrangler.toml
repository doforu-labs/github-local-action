name = "github-local-action"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1：事件日志。自增 id 就是客户端续传用的游标。
# 库名和 id 都要换成你自己的：
#   npx wrangler d1 create github_local_action
# 把输出里的 database_id 贴到下面（库名只用在这个文件里，不出现在任何 URL 和界面上）。
[[d1_databases]]
binding = "DB"
database_name = "github_local_action"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Durable Object：持有 WebSocket 连接、负责广播。
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# 免费计划只支持 SQLite 版 DO，必须写 new_sqlite_classes。
# 写成 new_classes 在免费计划上会部署失败。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true
