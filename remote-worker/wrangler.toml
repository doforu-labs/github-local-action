name = "github-local-action"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1：事件日志。自增 id 就是客户端续传用的游标。
# 库名还是老的 gh_relay：D1 没有重命名接口，免费计划每账号只给 10 个库、
# 现在正好占满，要改只能「删旧库再建新库 + 导入 8MB 的转储」，属于有风险的改动。
# 库名只出现在 wrangler d1 list 里，不出现在任何 URL 和界面上。
[[d1_databases]]
binding = "DB"
database_name = "gh_relay"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Durable Object：持有 WebSocket 连接、负责广播。
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# 免费计划只支持 SQLite 版 DO，必须写 new_sqlite_classes。
# 写成 new_classes 在免费计划上会部署失败。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true
