<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh-relay · 状态</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131822;
    --panel-2: #171e2b;
    --line: #222b3a;
    --text: #e6edf7;
    --dim: #7d8aa0;
    --green: #2ecc71;
    --red: #ff5c5c;
    --amber: #f0b429;
    --blue: #4cc9f0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b3546; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4759; }
  body {
    margin: 0; padding: 28px;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 0 rgba(46,204,113,.6); animation: pulse 2s infinite; }
  .dot.bad { background: var(--red); }
  .dot.idle { background: var(--amber); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,.5); }
    70% { box-shadow: 0 0 0 7px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  .cards {
    display: grid; gap: 12px; margin-bottom: 22px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 15px;
  }
  .card .k { font-size: 11.5px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
  .card .v { font-size: 21px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 3px; }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 22px; overflow: hidden;
  }
  .panel > .head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .panel > .head .t { font-weight: 600; font-size: 13.5px; }
  .panel > .head .s { color: var(--dim); font-size: 12px; }

  .chart { display: flex; align-items: flex-end; gap: 3px; height: 96px; padding: 16px; }
  .bar { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .75; transition: height .3s; position: relative; }
  .bar:hover { opacity: 1; }
  .bar.zero { background: var(--line); }

  #events { max-height: 62vh; overflow-y: auto; }
  .row {
    display: grid; grid-template-columns: 74px 116px 1fr auto;
    gap: 12px; align-items: center;
    padding: 9px 16px; border-bottom: 1px solid rgba(34,43,58,.55);
    font-size: 13px;
  }
  .row:last-child { border-bottom: 0; }
  .row.fresh { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: rgba(76,201,240,.14); } to { background: transparent; } }
  .row .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .row .repo { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .act { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    font-size: 11.5px; font-weight: 500; letter-spacing: .02em;
  }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }
  footer { color: var(--dim); font-size: 12px; display: flex; gap: 18px; flex-wrap: wrap; }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>gh-relay <span>· 本地接收端</span></h1>
  <div class="pill"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  <div class="pill" id="gapPill" hidden></div>
</header>

<div class="cards">
  <div class="card"><div class="k">游标</div><div class="v" id="cursor">–</div></div>
  <div class="card"><div class="k">今日事件</div><div class="v" id="today">–</div></div>
  <div class="card"><div class="k">总事件</div><div class="v" id="total">–</div></div>
  <div class="card"><div class="k">距上一条</div><div class="v" id="since">–</div></div>
  <div class="card"><div class="k">重连次数</div><div class="v" id="connects">–</div></div>
  <div class="card"><div class="k">SSE 客户端</div><div class="v" id="clients">–</div></div>
</div>

<div class="panel">
  <div class="head"><span class="t">最近 24 小时</span><span class="s" id="chartSub">每小时事件数</span></div>
  <div class="chart" id="chart"></div>
</div>

<div class="panel">
  <div class="head"><span class="t">事件流</span><span class="s" id="listSub">等待中…</span></div>
  <div id="events"><div class="empty">还没有事件</div></div>
</div>

<footer>
  <span>SSE <code>/stream</code></span>
  <span>历史 <code>/events?after=N</code></span>
  <span>健康 <code>/health</code></span>
  <span id="upd"></span>
</footer>

<script>
const COLORS = {
  push: '#4cc9f0', pull_request: '#b388ff', issues: '#f0b429',
  issue_comment: '#8d99ae', release: '#2ecc71', workflow_run: '#ff8fab',
  create: '#94d2bd', delete: '#ff5c5c', fork: '#c9ada7', star: '#ffd166',
  pull_request_review: '#a0c4ff', workflow_dispatch: '#ff8fab'
};
const MAX_ROWS = 200;
let latestId = 0;
let seen = new Set();

const $ = (id) => document.getElementById(id);

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function rel(sec) {
  if (sec == null) return '—';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm';
  if (sec < 86400) return (sec / 3600).toFixed(1) + 'h';
  return Math.floor(sec / 86400) + 'd';
}

function renderEvent(ev, fresh) {
  if (seen.has(ev.id)) return false;
  seen.add(ev.id);

  const box = $('events');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();

  const t = ev.event || 'unknown';
  const color = COLORS[t] || '#8d99ae';
  const row = document.createElement('div');
  row.className = 'row' + (fresh ? ' fresh' : '');
  row.innerHTML =
    '<span class="time">' + fmtTime(ev.at) + '</span>' +
    '<span><span class="badge" style="background:' + color + '22;color:' + color + '">' + t + '</span></span>' +
    '<span class="repo">' + (ev.repo || '—') + '</span>' +
    '<span class="act">' + (ev.action || '') + '</span>';

  box.prepend(row);
  while (box.children.length > MAX_ROWS) box.lastElementChild.remove();

  if (ev.id > latestId) latestId = ev.id;
  return true;
}

async function loadHistory() {
  try {
    const r = await fetch('/events?after=0&limit=60');
    const d = await r.json();
    const evs = (d.events || []).slice().sort((a, b) => a.id - b.id);
    $('events').innerHTML = '';
    seen.clear();
    for (const ev of evs) renderEvent(ev, false);
    $('listSub').textContent = evs.length ? '最近 ' + evs.length + ' 条' : '还没有事件';
  } catch (e) {
    $('listSub').textContent = '加载历史失败';
  }
}

function connect() {
  const es = new EventSource('/stream');
  es.addEventListener('gh', (e) => {
    try { renderEvent(JSON.parse(e.data), true); } catch (_) {}
  });
  es.onopen = () => $('listSub').textContent = '实时接收中';
  es.onerror = () => $('listSub').textContent = 'SSE 断开，浏览器会自动重连…';
}

async function pollHealth() {
  try {
    const d = await (await fetch('/health')).json();
    const dot = $('dot');
    dot.className = 'dot';

    if (d.connected) {
      const quiet = d.seconds_since_last_event != null && d.seconds_since_last_event > 3600;
      dot.classList.add(quiet ? 'idle' : 'ok');
      $('statusText').textContent = quiet ? '已连接 · 近期无事件' : '已连接';
      if (quiet) {
        $('gapPill').hidden = false;
        $('gapPill').textContent = '链路正常，' + rel(d.seconds_since_last_event) + '没有新事件';
      } else {
        $('gapPill').hidden = true;
      }
    } else {
      dot.classList.add('bad');
      $('statusText').textContent = '未连接' + (d.last_error ? ' · ' + d.last_error : '');
      $('gapPill').hidden = true;
    }

    $('cursor').textContent = d.cursor ?? '–';
    $('connects').textContent = d.connects ?? '–';
    $('clients').textContent = d.sse_clients ?? '–';
    $('since').innerHTML = rel(d.seconds_since_last_event) + (d.seconds_since_last_event != null ? '<small>前</small>' : '');
    $('upd').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    $('dot').className = 'dot bad';
    $('statusText').textContent = '连不上本地服务';
  }
}

async function pollStats() {
  try {
    const d = await (await fetch('/stats')).json();
    $('today').textContent = d.today ?? 0;
    $('total').textContent = d.total ?? 0;

    const hours = d.hourly || [];
    const max = Math.max(1, ...hours.map((h) => h.count));
    $('chart').innerHTML = hours.map((h) => {
      const pct = Math.max(2, Math.round((h.count / max) * 100));
      const cls = h.count ? 'bar' : 'bar zero';
      return '<div class="' + cls + '" style="height:' + pct + '%" title="' +
        h.label + '：' + h.count + ' 条"></div>';
    }).join('');
    $('chartSub').textContent = '每小时事件数 · 峰值 ' + max;
  } catch (e) { /* 下一轮再试 */ }
}

loadHistory();
connect();
pollHealth();
pollStats();
setInterval(pollHealth, 2000);
setInterval(pollStats, 30000);
</script>
</body>
</html>
