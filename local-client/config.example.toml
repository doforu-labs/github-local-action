[relay]
# 远程 Worker 的地址（部署 wrangler 后拿到）
ws_url = "wss://github-local-action.YOUR-SUBDOMAIN.workers.dev/ws"

# 和 wrangler secret put CLIENT_TOKEN 填的值一致
token = "REPLACE_WITH_A_LONG_RANDOM_STRING"

# 本地 SSE 端口。默认 18091
http_port = 18091

# 监听 0.0.0.0 才能被同网段的设备访问；只想本机用就改 127.0.0.1
http_host = "0.0.0.0"

# 本地库路径（相对 relay.py 所在目录）
db_path = "events.db"

# 协议层 ping 间隔（秒）：防 NAT / 代理回收空闲连接，30 是常规值
heartbeat = 30

# 应用层 ping 间隔（秒）：顺带确认对端真的还在处理消息
app_ping = 120

# 断线重连退避上限（秒）
reconnect_max = 60

# 只有「跑接收端的这台机器」发起的请求才能改配置、管机器、调 GitHub。默认只认
# 127.0.0.1 这类回环地址。在容器里跑时，宿主机浏览器过来的源地址是 docker 网桥
# 网关（如 172.17.0.1），不列出来就会 403。两种写法：
#   trusted_peers = ["gateway"]          # 自己从 /proc/net/route 认出默认网关（推荐）
#   trusted_peers = ["10.0.0.21", "172.17.0.1"]   # 或者手写具体地址
# 同网段的其他设备不在这里面，照样只会被拦。环境变量 GLA_TRUSTED_PEERS 也能给
# （逗号分隔），两个来源会合并去重。
# trusted_peers = ["gateway"]
